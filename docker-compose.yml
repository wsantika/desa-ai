services:
  db:
    image: postgres:16-alpine
    container_name: desa-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: desa_ai
    ports:
      - "5432:5432"
    volumes:
      - desa_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desa_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: desa-ai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/desa_ai?schema=public
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src/generated
    depends_on:
      db:
        condition: service_healthy

volumes:
  desa_ai_pgdata:
    name: desa_ai_pgdata
